<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Meal Planner</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Animate.css for animations -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
      }
      /* Spinner style */
      .spinner {
        border: 4px solid rgba(0, 0, 0, 0.1);
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border-left-color: #4a5568;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* Notification styles */
      #notification {
        position: fixed;
        top: 1rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
      }
    </style>
  </head>
  <body class="bg-gray-100">
    <!-- Notification Container -->
    <div id="notification"></div>

    <div class="min-h-screen flex flex-col">
      <header class="bg-green-600 text-white shadow-lg">
        <nav class="container mx-auto px-6 py-3 flex justify-between items-center">
          <div class="text-2xl font-bold">
            Goal-i<sup>th</sup>: The Meal Planner
          </div>
          <div>
            <a href="#" class="text-white hover:text-green-200 px-3 py-2">Home</a>
            <a href="#" class="text-white hover:text-green-200 px-3 py-2">About</a>
            <a href="#" class="text-white hover:text-green-200 px-3 py-2">Contact</a>
          </div>
        </nav>
      </header>

      <main class="flex-grow container mx-auto px-6 py-8">
        <h1 class="text-4xl font-bold text-gray-800 mb-8">
          Optimize Your Nutrition
        </h1>

        <!-- Personal Information Form -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8 animate__animated animate__fadeIn">
          <h2 class="text-2xl font-semibold text-gray-700 mb-4">
            Personal Information
          </h2>
          <form id="personal-info-form" class="grid grid-cols-1 md:grid-cols-2 gap-6" novalidate>
            <!-- Add required attributes and proper labels for accessibility -->
            <div>
              <label for="gender" class="block text-sm font-medium text-gray-700 mb-1">Gender</label>
              <select id="gender" name="gender" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                <option value="m">Male</option>
                <option value="f">Female</option>
              </select>
            </div>
            <div>
              <label for="age" class="block text-sm font-medium text-gray-700 mb-1">Age</label>
              <input type="number" id="age" name="age" required min="19" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" />
            </div>
            <div>
              <label for="weight" class="block text-sm font-medium text-gray-700 mb-1">Weight (kg)</label>
              <input type="number" id="weight" name="weight" required min="30" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" />
            </div>
            <div>
              <label for="height" class="block text-sm font-medium text-gray-700 mb-1">Height (cm)</label>
              <input type="number" id="height" name="height" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" />
            </div>
            <div>
              <label for="sport" class="block text-sm font-medium text-gray-700 mb-1">Sport</label>
              <select id="sport" name="sport" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                <option value="Cricket">Cricket</option>
                <option value="Football">Football</option>
                <option value="Badminton">Badminton</option>
                <option value="Tennis">Tennis</option>
                <option value="Athletics">Athletics</option>
                <option value="Casual Gym">Casual Gym</option>
                <option value="Sedentary">Sedentary</option>
              </select>
            </div>
            <div>
              <label for="role" class="block text-sm font-medium text-gray-700 mb-1">Role</label>
              <select id="role" name="role" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                <!-- Options populated dynamically via script.js -->
              </select>
            </div>
            <div>
              <label for="is_athlete" class="block text-sm font-medium text-gray-700 mb-1">
                Are you an Athlete? (10-20% male / 17-27% female body fat)
              </label>
              <select id="is_athlete" name="is_athlete" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                <option value="no">No</option>
                <option value="yes">Yes</option>
              </select>
            </div>
            <div>
              <label for="goal" class="block text-sm font-medium text-gray-700 mb-1">Goal</label>
              <select id="goal" name="goal" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                <option value="cutting">Cutting</option>
                <option value="maintaining">Maintaining</option>
                <option value="bulking">Bulking</option>
              </select>
            </div>
            <div>
              <label for="diet" class="block text-sm font-medium text-gray-700 mb-1">Dietary Preference</label>
              <select id="diet" name="diet" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                <option value="non-vegetarian">Non-Vegetarian</option>
                <option value="eggetarian">Eggetarian</option>
                <option value="vegetarian">Vegetarian</option>
              </select>
            </div>
            <div>
              <label for="high_cholesterol" class="block text-sm font-medium text-gray-700 mb-1">High Cholesterol?</label>
              <select id="high_cholesterol" name="high_cholesterol" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                <option value="no">No</option>
                <option value="yes">Yes</option>
              </select>
            </div>
            <div>
              <label for="high_blood_sugar" class="block text-sm font-medium text-gray-700 mb-1">High Blood Sugar?</label>
              <select id="high_blood_sugar" name="high_blood_sugar" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                <option value="no">No</option>
                <option value="yes">Yes</option>
              </select>
            </div>
            <div>
              <label for="high_blood_pressure" class="block text-sm font-medium text-gray-700 mb-1">High Blood Pressure?</label>
              <select id="high_blood_pressure" name="high_blood_pressure" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                <option value="no">No</option>
                <option value="yes">Yes</option>
              </select>
            </div>
            <div>
              <label for="heart_rate" class="block text-sm font-medium text-gray-700 mb-1">Resting Heart Rate (bpm)</label>
              <input type="number" id="heart_rate" name="heart_rate" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" />
            </div>
            <!-- NEW: Number of Meals -->
            <div>
              <label for="meal_count" class="block text-sm font-medium text-gray-700 mb-1">Number of Meals</label>
              <select id="meal_count" name="meal_count" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                <option value="3">3</option>
                <option value="4" selected>4</option>
                <option value="5">5</option>
              </select>
            </div>

             <!-- NEW – TRAINING SESSIONS -->
             <div>
              <label for="session_count" class="block text-sm font-medium text-gray-700 mb-1">Number of Training Sessions for the Day</label>
              <select id="session_count" name="session_count" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                <option value="0">No Sessions</option>
                <option value="1">1 Session</option>
                <option value="2">2 Sessions</option>
                <option value="3">3 Sessions</option>
              </select>
            </div>
            <!-- We'll dynamically generate <input> for times inside this container -->
            <div class="md:col-span-2">
              <div id="session-times-container" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
            </div>
            <!-- END TRAINING SESSIONS -->

            <div class="md:col-span-2">
              <button
                type="submit"
                class="w-full bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700 transition duration-300"
              >
                Calculate
              </button>
            </div>
          </form>
        </div>

        <!-- Results Section -->
        <div id="results" class="bg-white rounded-lg shadow-md p-6 mb-8 hidden animate__animated animate__fadeIn">
          <h2 class="text-2xl font-semibold text-gray-700 mb-4">Your Results</h2>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-gray-100 p-4 rounded-md">
              <h3 class="font-semibold text-gray-700">BMR</h3>
              <p id="bmr-result" class="text-2xl font-bold text-green-600"></p>
            </div>
            <div class="bg-gray-100 p-4 rounded-md">
              <h3 class="font-semibold text-gray-700">TDEE</h3>
              <p id="tdee-result" class="text-2xl font-bold text-green-600"></p>
            </div>
            <div class="bg-gray-100 p-4 rounded-md">
              <h3 class="font-semibold text-gray-700">Daily Caloric Intake</h3>
              <p id="calorie-result" class="text-2xl font-bold text-green-600"></p>
            </div>
          </div>
          <!-- Nutrients (Macros) -->
          <div id="nutrients-info" class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4"></div>

          <!-- Meal Planner Section -->
          <div id="meal-suggestion-section" class="mt-6 text-center">
            <button id="suggest-meals-btn" class="bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700 transition duration-300 inline-flex items-center">
              <span id="suggest-btn-text">Suggest Meal Plan</span>
              <span id="suggest-spinner" class="ml-2 hidden spinner"></span>
            </button>
          </div>

          <!-- Meal Plan Options & Summary -->
          <div id="meal-plan" class="mt-6 hidden animate__animated animate__fadeIn">
            <h2 class="text-2xl font-semibold text-gray-700 mb-4">Your Meal Plan</h2>
            <div id="meal-plan-content"></div>
            <div id="meal-plan-summary" class="mt-4 p-4 bg-gray-100 rounded-md"></div>
          </div>
        </div>
      </main>

      <footer class="bg-gray-800 text-white py-4">
        <div class="container mx-auto px-6 text-center">
          <p>&copy; 2025 Goal-i<sup>th</sup>. All rights reserved.</p>
        </div>
      </footer>
    </div>
    
    <!-- Load the client-side JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/script.js"></script>
  </body>
</html>
